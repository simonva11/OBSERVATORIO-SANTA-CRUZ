# Despliegue en Netlify. El sitio es estático (HashRouter): no necesita redirecciones ni servidor.
# Rama de producción sugerida: main. Las ramas Dev y QA y los pull requests tienen su propia URL de vista previa.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# El service worker y el manifest nunca deben quedarse en la caché del navegador:
# si no, las versiones nuevas de la app no llegan a las personas que ya la instalaron.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Código, estilos y fuentes llevan un hash en el nombre: se pueden guardar un año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Íconos de la app
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Encabezados de seguridad básicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
